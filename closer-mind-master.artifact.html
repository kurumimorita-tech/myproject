<style>
/* ===========================================================
   Closer Mind Master(仮)
   携帯販売クローザー向け メンタル格ゲー風ロープレ
   単一ファイル・外部依存なし・スマホ横画面(16:9)想定
   =========================================================== */

:root{
  --bg:#0a0612;
  --bg2:#140a22;
  --panel:#1b1030;
  --panel2:#241640;
  --neon-red:#ff2d55;
  --neon-pink:#ff4d8d;
  --neon-yellow:#ffe14d;
  --neon-cyan:#26e0ff;
  --neon-green:#39ff88;
  --text:#f5f0ff;
  --muted:#a99fc9;
  --hp:#39ff88;
  --hp-low:#ff2d55;
  --temp-cold:#3a7bd5;
  --temp-warm:#ffb52e;
  --temp-hot:#ff2d55;
  --stroke:#3a2760;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 20% -10%, #2a123f 0%, transparent 60%),
    radial-gradient(1000px 700px at 90% 110%, #3a0f2a 0%, transparent 55%),
    linear-gradient(160deg,var(--bg) 0%, var(--bg2) 100%);
  color:var(--text);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

/* ---- ステージ全体：16:9のバトルステージを中央に敷き詰める ---- */
#stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#frame{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  background:linear-gradient(180deg,#160c26 0%, #0d0718 100%);
  border:2px solid var(--stroke);
  box-shadow:0 0 0 2px #000 inset, 0 0 60px rgba(255,45,85,.15), 0 0 120px rgba(38,224,255,.08);
  overflow:hidden;
}

/* スキャンライン風の演出 */
#frame::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay; opacity:.5;
}

/* 縦持ち警告 */
#rotate{
  position:fixed; inset:0; z-index:9999; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:var(--bg); text-align:center; padding:24px;
}
#rotate .ph{font-size:60px; animation:spin 2.5s ease-in-out infinite;}
@keyframes spin{0%,45%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:820px){ #rotate{display:flex;} }

.screen{position:absolute; inset:0; display:none; flex-direction:column;}
.screen.active{display:flex;}

/* 汎用ボタン */
.btn{
  font-family:inherit; font-weight:800; letter-spacing:.02em;
  border:none; cursor:pointer; color:#160611;
  background:linear-gradient(180deg,var(--neon-yellow),#ffb52e);
  border-radius:12px; padding:14px 22px; font-size:clamp(13px,2.6vh,20px);
  box-shadow:0 4px 0 #a5701a, 0 6px 18px rgba(255,225,77,.35);
  transition:transform .06s ease, box-shadow .06s ease, filter .1s;
}
.btn:active{transform:translateY(4px); box-shadow:0 0 0 #a5701a, 0 2px 8px rgba(255,225,77,.3); filter:brightness(1.1);}
.btn.ghost{
  background:linear-gradient(180deg,#2a1a44,#1c1030); color:var(--text);
  box-shadow:0 3px 0 #120a22, 0 0 0 1px var(--stroke) inset;
}
.btn.ghost:active{transform:translateY(3px); box-shadow:0 0 0 #120a22, 0 0 0 1px var(--stroke) inset;}
.btn.red{
  background:linear-gradient(180deg,var(--neon-pink),var(--neon-red)); color:#fff;
  box-shadow:0 4px 0 #8a0f2c, 0 6px 18px rgba(255,45,85,.4);
}

/* =======================  TITLE  ======================= */
#titleScreen{align-items:center; justify-content:center; gap:2.2vh; text-align:center; padding:4vh;}
.logo{
  font-size:clamp(28px,8.4vh,72px); font-weight:900; line-height:.98; letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 0%, var(--neon-yellow) 45%, var(--neon-red) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,45,85,.55)) drop-shadow(0 2px 0 #5a0018);
  transform:skewX(-6deg);
}
.logo small{display:block; font-size:.34em; letter-spacing:.5em; color:var(--neon-cyan);
  -webkit-text-fill-color:var(--neon-cyan); filter:none; transform:skewX(6deg); margin-top:.6em;}
.tagline{color:var(--muted); font-size:clamp(11px,2.3vh,16px); max-width:80%; line-height:1.6;}
.blink{animation:blink 1.1s steps(2,start) infinite;}
@keyframes blink{50%{opacity:.25}}

/* =======================  STAGE SELECT  ======================= */
#selectScreen{padding:3.2vh 3.4vw; gap:1.6vh;}
.head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.head h2{margin:0; font-size:clamp(16px,3.4vh,26px);
  color:var(--neon-yellow); text-shadow:0 0 12px rgba(255,225,77,.4);}
.stageGrid{display:flex; gap:2vw; flex:1; align-items:stretch; overflow-x:auto; padding-bottom:6px;}
.stageCard{
  flex:1 0 30%; min-width:180px; background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--stroke); border-radius:16px; padding:2.4vh 2vw;
  display:flex; flex-direction:column; gap:1.1vh; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .1s, box-shadow .1s;
}
.stageCard::before{content:""; position:absolute; inset:0;
  background:radial-gradient(120px 80px at 100% 0%, rgba(255,45,85,.18), transparent 60%); pointer-events:none;}
.stageCard:active{transform:scale(.97);}
.stageCard.locked{opacity:.45; filter:grayscale(.7);}
.stageCard .no{font-size:clamp(10px,2vh,13px); letter-spacing:.3em; color:var(--neon-cyan);}
.stageCard .ttl{font-size:clamp(15px,3vh,22px); font-weight:900; line-height:1.2;}
.stageCard .desc{font-size:clamp(10px,2vh,13px); color:var(--muted); line-height:1.5; flex:1;}
.stageCard .meta{display:flex; gap:8px; flex-wrap:wrap; font-size:clamp(9px,1.8vh,12px);}
.chip{background:#0f0820; border:1px solid var(--stroke); border-radius:999px; padding:3px 9px; color:var(--neon-yellow);}
.chip.diff{color:var(--neon-red);}

/* =======================  BATTLE  ======================= */
#battleScreen{padding:0;}
.hud{
  position:absolute; top:0; left:0; right:0; padding:1.4vh 2.2vw 0;
  display:flex; justify-content:space-between; align-items:flex-start; gap:2vw; z-index:5;
}
.enemyInfo{flex:1; min-width:0;}
.enemyInfo .name{font-size:clamp(12px,2.6vh,18px); font-weight:900;}
.enemyInfo .name .tag{font-size:.7em; color:var(--neon-cyan); margin-left:.5em; font-weight:700;}
.enemyInfo .sub{font-size:clamp(9px,1.9vh,12px); color:var(--muted); margin-top:2px;}

/* 温度感メーター */
.tempWrap{margin-top:.7vh;}
.tempTop{display:flex; justify-content:space-between; align-items:baseline; font-size:clamp(9px,1.9vh,12px);}
.tempTop b{color:var(--neon-yellow); font-size:1.35em;}
.meter{height:2.1vh; min-height:12px; border-radius:999px; background:#0c0718;
  border:1px solid var(--stroke); overflow:hidden; position:relative; box-shadow:0 0 0 2px #000 inset;}
#tempFill{height:100%; width:30%; border-radius:999px;
  background:linear-gradient(90deg,var(--temp-cold),var(--temp-warm) 55%, var(--temp-hot));
  transition:width .6s cubic-bezier(.2,.9,.2,1), filter .3s;
  box-shadow:0 0 14px rgba(255,45,85,.6);}
.meter .ticks{position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, transparent 0 19%, rgba(0,0,0,.5) 19% 20%);}

/* 右上 ステージ進捗 */
.progress{display:flex; gap:6px; align-items:center;}
.dot{width:12px; height:12px; border-radius:50%; background:#3a2760; border:1px solid #000;}
.dot.on{background:var(--neon-yellow); box-shadow:0 0 8px var(--neon-yellow);}
.dot.cur{background:var(--neon-red); box-shadow:0 0 10px var(--neon-red); animation:pulse 1s infinite;}
@keyframes pulse{50%{transform:scale(1.25)}}

/* 敵グラフィック */
.enemyStage{position:absolute; top:11vh; left:0; right:0; bottom:34vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2vh;}
/* 家族グループ（SVGキャラを横並び） */
#enemyGroup{
  display:flex; align-items:flex-end; justify-content:center; gap:.6vw;
  height:42vh; filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));
  transition:transform .25s;
}
#enemyGroup.hit{animation:enemyHit .4s;}
.slot{position:relative; height:100%; display:flex; align-items:flex-end;}
.slot .person{height:100%; width:auto; display:block;}
.baby-ov{position:absolute; bottom:1%; left:50%; transform:translateX(-32%);
  width:46%; z-index:3; filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
.baby-ov .person{height:auto; width:100%;}
@keyframes enemyHit{0%{transform:scale(1)}30%{transform:scale(1.08) translateX(-6px)}60%{transform:scale(1.02) translateX(6px)}100%{transform:scale(1)}}
.moodRing{
  position:absolute; width:clamp(140px,34vh,320px); height:clamp(140px,34vh,320px);
  border-radius:50%; filter:blur(24px); opacity:.5; z-index:-1; transition:background .5s;
}

/* セリフ吹き出し */
.bubble{
  position:relative; max-width:76%; background:linear-gradient(180deg,#fff,#f0ecff); color:#1a1030;
  border-radius:14px; padding:1.4vh 2.4vw; font-weight:800; font-size:clamp(12px,2.7vh,20px);
  line-height:1.4; box-shadow:0 6px 0 rgba(0,0,0,.35), 0 0 26px rgba(255,255,255,.18);
  text-align:center; min-height:3vh;
}
.bubble::after{content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  border:12px solid transparent; border-top-color:#f0ecff;}
.bubble.think{background:linear-gradient(180deg,#fff7d6,#ffe89a);}
.bubble.think::after{border-top-color:#ffe89a;}
.bubble.warm{background:linear-gradient(180deg,#e8ffef,#c5ffdb);}
.bubble.warm::after{border-top-color:#c5ffdb;}

/* プレイヤーHP + 選択肢 */
.playerZone{position:absolute; left:0; right:0; bottom:0; padding:0 2.2vw 2.2vh;
  display:flex; flex-direction:column; gap:1vh; z-index:6;}
.hpRow{display:flex; align-items:center; gap:2vw;}
.hpLabel{font-size:clamp(10px,2vh,14px); font-weight:900; color:var(--neon-green);
  white-space:nowrap; text-shadow:0 0 8px rgba(57,255,136,.5);}
.hpBarWrap{flex:1; height:2.4vh; min-height:14px; background:#0c0718; border:1px solid var(--stroke);
  border-radius:8px; overflow:hidden; position:relative; box-shadow:0 0 0 2px #000 inset;}
#hpFill{height:100%; width:100%;
  background:linear-gradient(90deg,#1e7a4a,var(--hp)); transition:width .5s cubic-bezier(.2,.9,.2,1), background .3s;}
#hpNum{font-size:clamp(11px,2.2vh,16px); font-weight:900; min-width:5.5ch; text-align:right;}

.choices{display:grid; grid-template-columns:1fr 1fr; gap:1vh 2vw;}
.choice{
  font-family:inherit; text-align:left; cursor:pointer; color:var(--text);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--stroke); border-radius:12px;
  padding:1.3vh 2.2vw; font-size:clamp(11px,2.3vh,17px); font-weight:700; line-height:1.35;
  position:relative; overflow:hidden; min-height:6.2vh; display:flex; align-items:center; gap:1.4vw;
  box-shadow:0 3px 0 #0c0718; transition:transform .07s, box-shadow .07s, background .2s;
}
.choice .k{flex:0 0 auto; width:clamp(20px,4vh,30px); height:clamp(20px,4vh,30px);
  display:grid; place-items:center; border-radius:8px; font-weight:900; font-size:.9em;
  background:var(--neon-cyan); color:#04212a;}
.choice:active{transform:translateY(3px); box-shadow:0 0 0 #0c0718;}
.choice.disabled{pointer-events:none; opacity:.55;}
.choice.correct{background:linear-gradient(180deg,#134d2c,#0c3a20); border-color:var(--neon-green);}
.choice.correct .k{background:var(--neon-green);}
.choice.wrong{background:linear-gradient(180deg,#5a1226,#3d0c19); border-color:var(--neon-red);}
.choice.wrong .k{background:var(--neon-red); color:#fff;}

/* フローティングダメージ/回復テキスト */
.float{position:absolute; z-index:20; font-weight:900; font-size:clamp(20px,5vh,44px);
  pointer-events:none; text-shadow:0 2px 0 #000, 0 0 18px currentColor; animation:floatUp 1.1s ease-out forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(.6); opacity:0}
  20%{transform:translateY(-10px) scale(1.15); opacity:1}
  100%{transform:translateY(-70px) scale(1); opacity:0}}

/* バトル上部のツール */
.topRight{display:flex; flex-direction:column; align-items:flex-end; gap:.8vh;}
.iconbtn{background:#1a1030; border:1px solid var(--stroke); color:var(--muted);
  border-radius:8px; padding:.6vh 1.4vw; font-size:clamp(9px,1.9vh,12px); cursor:pointer; font-weight:700;}
.iconbtn:active{transform:scale(.94);}

/* 画面フラッシュ（被弾） */
#flash{position:absolute; inset:0; pointer-events:none; opacity:0; z-index:15;}
#flash.dmg{background:radial-gradient(circle,transparent 40%, rgba(255,45,85,.55)); animation:flashHit .35s;}
#flash.heal{background:radial-gradient(circle,transparent 40%, rgba(57,255,136,.4)); animation:flashHit .35s;}
@keyframes flashHit{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.shake{animation:shake .35s;}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}
  40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}

/* =======================  CLEAR  ======================= */
#clearScreen,#overScreen{align-items:center; justify-content:center; text-align:center; gap:2vh; padding:4vh;}
.bigResult{font-size:clamp(40px,13vh,120px); font-weight:900; line-height:.95; transform:skewX(-6deg);}
#clearScreen .bigResult{
  background:linear-gradient(180deg,#fff,var(--neon-yellow) 50%,var(--neon-green));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(57,255,136,.6)); animation:pop .5s;}
#overScreen .bigResult{
  background:linear-gradient(180deg,#fff,var(--neon-pink) 50%,var(--neon-red));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,45,85,.6)); animation:pop .5s;}
@keyframes pop{0%{transform:scale(.4) skewX(-6deg); opacity:0}70%{transform:scale(1.12) skewX(-6deg)}100%{transform:scale(1) skewX(-6deg); opacity:1}}
.quoteBox{max-width:86%; background:rgba(10,6,20,.7); border:1px solid var(--stroke);
  border-radius:16px; padding:2.6vh 3vw;}
.quote{font-size:clamp(15px,3.6vh,30px); font-weight:900; line-height:1.5; color:var(--neon-yellow);
  text-shadow:0 0 14px rgba(255,225,77,.4);}
.quoteSub{margin-top:1.2vh; font-size:clamp(11px,2.3vh,15px); color:var(--muted); line-height:1.6;}
.resultStats{display:flex; gap:2.4vw; color:var(--muted); font-size:clamp(11px,2.3vh,15px);}
.resultStats b{color:var(--text);}
.btnRow{display:flex; gap:2vw; flex-wrap:wrap; justify-content:center;}

/* 紙吹雪 */
.confetti{position:absolute; top:-20px; width:10px; height:16px; z-index:1; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg); opacity:.2}}
</style>

<div id="rotate">
  <div class="ph">📱</div>
  <div style="font-weight:900;font-size:20px;color:var(--neon-yellow)">画面を横向きにしてね</div>
  <div style="color:var(--muted);font-size:13px">Closer Mind Master は横画面バトル専用だ</div>
</div>

<div id="stage">
  <div id="frame">

    <!-- ============ TITLE ============ -->
    <section class="screen active" id="titleScreen">
      <div class="logo">CLOSER<br>MIND MASTER<small>心理戦バトル・ロープレ</small></div>
      <div class="tagline">拒絶(ネガティブアウト)は経験値。<br>お客様の温度感を100%にして「成約」を勝ち取れ！</div>
      <button class="btn" id="toSelect" style="margin-top:1vh">▶ ゲームスタート</button>
      <div class="tagline blink" style="font-size:clamp(10px,2vh,13px)">TAP TO START</div>
    </section>

    <!-- ============ STAGE SELECT ============ -->
    <section class="screen" id="selectScreen">
      <div class="head">
        <h2>STAGE SELECT</h2>
        <button class="btn ghost" id="backTitle" style="padding:8px 16px;font-size:13px">← TITLE</button>
      </div>
      <div class="stageGrid" id="stageGrid"><!-- JSで生成 --></div>
      <div class="tagline" style="text-align:center">カードをタップしてバトル開始</div>
    </section>

    <!-- ============ BATTLE ============ -->
    <section class="screen" id="battleScreen">
      <div id="flash"></div>

      <!-- HUD 上部 -->
      <div class="hud">
        <div class="enemyInfo">
          <div class="name" id="enemyName">お客様</div>
          <div class="sub" id="enemySub">客層情報</div>
          <div class="tempWrap">
            <div class="tempTop"><span>温度感 TEMPERATURE</span><span><b id="tempNum">30</b>%</span></div>
            <div class="meter"><div id="tempFill"></div><div class="ticks"></div></div>
          </div>
        </div>
        <div class="topRight">
          <div class="progress" id="progress"></div>
          <button class="iconbtn" id="giveUp">✕ 撤退</button>
        </div>
      </div>

      <!-- 敵グラフィック -->
      <div class="enemyStage">
        <div class="moodRing" id="moodRing"></div>
        <div id="enemyGroup"></div>
        <div class="bubble" id="bubble">…なに？</div>
      </div>

      <!-- プレイヤーゾーン -->
      <div class="playerZone">
        <div class="hpRow">
          <span class="hpLabel">🧠 メンタルHP</span>
          <div class="hpBarWrap"><div id="hpFill"></div></div>
          <span id="hpNum">100/100</span>
        </div>
        <div class="choices" id="choices"></div>
      </div>
    </section>

    <!-- ============ CLEAR ============ -->
    <section class="screen" id="clearScreen">
      <div class="bigResult">成約！！</div>
      <div class="quoteBox">
        <div class="quote" id="clearQuote">よっしゃ、契約いただきました！</div>
      </div>
      <div class="resultStats" id="clearStats"></div>
      <div class="btnRow">
        <button class="btn" id="clearNext">▶ 次のステージへ</button>
        <button class="btn ghost" id="clearSelect">ステージ選択</button>
      </div>
    </section>

    <!-- ============ GAME OVER ============ -->
    <section class="screen" id="overScreen">
      <div class="bigResult">失注…</div>
      <div class="quoteBox">
        <div class="quote" id="overQuote"></div>
        <div class="quoteSub" id="overSub"></div>
      </div>
      <div class="btnRow">
        <button class="btn red" id="retry">🔥 即リトライ</button>
        <button class="btn ghost" id="overSelect">ステージ選択</button>
      </div>
    </section>

  </div>
</div>

<script>
/* =======================================================================
   シナリオデータ
   各ステージ: 顧客プロフィール + 3つの質問(拒絶文句)
   各質問: 4つの選択肢
     - text : 選択肢文言
     - temp : 温度感の増減
     - hp   : メンタルHPの増減
     - reply: 選んだ時の顧客セリフ変化
     - best : この質問の模範解答か(演出用)
   ======================================================================= */
const STAGES = [
  {
    id: 1,
    title: "知識もあり乗り換えをしたいお客様",
    diff: "★☆☆",
    enemy: "情報通の乗り換え検討客",
    face0: "😒",
    profile: { crowd: "1人（他社ユーザー）", age: "30代・男性", situation: "イベントブースをチラ見しながら通過中" },
    sub: "客層：30代・男性/1人来場 ｜ 自分で調べるタイプ",
    partyRule: "any",
    trait: "情報通・自分で調べるタイプ",
    startTemp: 30,
    desc: "料金プランを自分で調べ済み。乗り換え意欲はあるが「営業に丸め込まれたくない」と警戒中。",
    quotes: [
      "「なるほど、それなら乗り換えるわ」",
      "「詳しいね、アンタから買うよ」"
    ],
    questions: [
      {
        text: "高いからいいよ。今のとこで十分間に合ってるし。",
        choices: [
          { text: "実は今のプラン、使ってないオプションで月2,000円損してるかもしれません。今の明細、一緒に見てみませんか？", temp:22, hp:0,  best:true,  reply:"「…使ってないオプション？ ちょっと気になるな」" },

  if (type === 'baby') return drawBaby(mood);
  const c = CHARS[type];
  const glasses = c.glasses
    ? `<g fill="none" stroke="#2a2320" stroke-width="1.8"><rect x="38" y="47" width="16" height="12" rx="3"/><rect x="66" y="47" width="16" height="12" rx="3"/><line x1="54" y1="52" x2="66" y2="52"/></g>`
    : '';
  const nose = `<path d="M57,58 Q60,63 63,58" fill="none" stroke="#c98b63" stroke-width="1.4" stroke-linecap="round"/>`;
  const wrinkles = c.old
    ? `<g stroke="#c98b63" stroke-width="1" fill="none" opacity=".5"><path d="M40,63 Q45,65 50,63"/><path d="M70,63 Q75,65 80,63"/><path d="M44,45 Q48,43 52,45"/></g>`
    : '';
  return `<svg class="person" viewBox="0 0 120 178" xmlns="http://www.w3.org/2000/svg">
    ${hairBack(c)}
    ${body(c)}
    <rect x="52" y="80" width="16" height="16" rx="4" fill="${c.skin}"/>
    <ellipse cx="60" cy="53" rx="30" ry="33" fill="${c.skin}"/>
    <ellipse cx="30" cy="56" rx="4.5" ry="6" fill="${c.skin}"/><ellipse cx="90" cy="56" rx="4.5" ry="6" fill="${c.skin}"/>
    ${hairFront(c)}
    ${nose}${wrinkles}
    ${faceParts(mood, c)}
    ${glasses}
  </svg>`;
}

/* ---- 温度感 → 気分 ---- */
function moodName(t){ return t >= 80 ? 'smile' : (t >= 40 ? 'think' : 'cold'); }

/* ---- 家族グループを描画 ---- */
function renderGroup(mood){
  const g = $("enemyGroup");
  if (!g || !S.party) return;
  const n = S.party.members.length;
  g.style.height = n <= 1 ? '42vh' : n === 2 ? '40vh' : n === 3 ? '35vh' : '30vh';
  g.innerHTML = '';
  S.party.members.forEach(m => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = drawPerson(m.type, mood);
    if (m.baby){
      const b = document.createElement('div');
      b.className = 'baby-ov';
      b.innerHTML = drawBaby(mood);
      slot.appendChild(b);
    }
    g.appendChild(slot);
  });
}

/* ---- 赤ちゃんを抱っこさせる（親→祖父母の優先順で） ---- */
function assignBaby(members, p){
  if (!chance(p)) return;
  const pref = ['mom','dad','grandma','grandpa'];
  for (const t of pref){
    const h = members.find(m => m.type === t && !m.baby);
    if (h){ h.baby = true; return; }
  }
}

/* ---- 構成をランダム生成（子供だけ・単独の子供は出さない） ---- */
function randomComposition(){
  const roll = rnd();
  if (roll < 0.22) return [{type: pick(['dad','mom','grandpa','grandma'])}];       // 単独の大人
  if (roll < 0.38) return [{type:'dad'}, {type:'mom'}];                            // 若い夫婦
  if (roll < 0.50) return [{type:'grandpa'}, {type:'grandma'}];                    // ご年配夫婦
  if (roll < 0.72){                                                                // 若いご家族（親＋子）
    const ad = shuffle(['dad','mom']).slice(0, chance(0.6) ? 2 : 1);
    const kd = shuffle(['son','daughter']).slice(0, chance(0.5) ? 2 : 1);
    return ad.concat(kd).map(t => ({type:t}));
  }
  if (roll < 0.86) return [{type: pick(['dad','mom'])}, {type: pick(['son','daughter'])}]; // 親子
  const arr = [pick(['grandpa','grandma']), pick(['dad','mom'])];                  // 3世代
  if (chance(0.6)) arr.push(pick(['son','daughter']));
  return arr.map(t => ({type:t}));
}

function genParty(rule){
  let members;
  if (rule === 'soloYoung'){
    members = [{type:'youngman'}];                       // 単独の若い男性（塩対応）
  } else if (rule === 'youngFamily'){                    // 母を必ず含む若い層（会話整合のため）
    if (chance(0.5)){
      members = [{type:'dad'}, {type:'mom'}];
    } else {
      const kd = shuffle(['son','daughter']).slice(0, chance(0.5) ? 2 : 1).map(t => ({type:t}));
      members = [{type:'dad'}, {type:'mom'}].concat(kd);
    }
    assignBaby(members, 0.55);
  } else {                                               // 'any' 完全ランダム
    members = randomComposition();
    assignBaby(members, 0.30);
  }
  return { members, crowd: labelParty(members) };
}

function labelParty(members){
  const has = (t) => members.some(m => m.type === t);
  const cnt = members.length;
  const hasGP = has('grandpa') || has('grandma');
  const hasPar = has('dad') || has('mom');
  const hasChild = has('son') || has('daughter');
  const baby = members.some(m => m.baby);
  let label;
  if (has('youngman'))                                  label = '単身（若い男性）';
  else if (hasGP && hasPar && hasChild)                 label = '3世代ご家族';
  else if (hasChild && cnt >= 3)                        label = 'ご家族';
  else if (hasChild)                                    label = '親子';
  else if (cnt === 2 && has('dad') && has('mom'))       label = 'ご夫婦（若い）';
  else if (cnt === 2 && has('grandpa') && has('grandma')) label = 'ご夫婦（ご年配）';
  else if (cnt === 1)                                   label = '単身';
  else                                                  label = 'ご家族';
  const ages = [...new Set(members.map(m => TYPE_INFO[m.type].age))].join('・');
  return `客層：${label}${baby ? '＋赤ちゃん(抱っこ)' : ''} ｜ ${cnt}人${baby ? '＋乳児' : ''}来場（${ages}）`;
}

/* ======================= ゲーム状態 ======================= */
const S = {
  stageIndex: 0,
  qIndex: 0,
  temp: 30,
  hp: 100,
  maxHp: 100,
  locked: false,
  party: null,                    // 現在の客層（家族構成）
  cleared: [true, false, false] // stage1のみ最初から解放
};

/* ======================= DOM ヘルパ ======================= */
const $ = (id) => document.getElementById(id);
const screens = {
  title: $("titleScreen"), select: $("selectScreen"), battle: $("battleScreen"),
  clear: $("clearScreen"), over: $("overScreen")
};
function show(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}

/* ======================= タイトル/選択 ======================= */
$("toSelect").onclick = () => { buildStageSelect(); show("select"); };
$("backTitle").onclick = () => show("title");

function buildStageSelect(){
  const grid = $("stageGrid");
  grid.innerHTML = "";
  STAGES.forEach((st, i) => {
    const unlocked = S.cleared[i] || (i>0 && S.cleared[i-1]);
    const card = document.createElement("div");
    card.className = "stageCard" + (unlocked ? "" : " locked");
    card.innerHTML = `
      <div class="no">STAGE ${st.id}</div>
      <div class="ttl">${unlocked ? st.title : "？？？"}</div>
      <div class="desc">${unlocked ? st.desc : "前のステージをクリアで解放"}</div>
      <div class="meta">
        <span class="chip diff">難易度 ${st.diff}</span>
        <span class="chip">${st.enemy}</span>
      </div>`;
    if (unlocked) card.onclick = () => startStage(i);
    grid.appendChild(card);
  });
}

/* ======================= バトル開始 ======================= */
function startStage(i){
  S.stageIndex = i;
  S.qIndex = 0;
  S.temp = STAGES[i].startTemp;
  S.hp = S.maxHp;
  S.locked = false;
  const st = STAGES[i];
  S.party = genParty(st.partyRule);                       // 客層をランダム生成
  $("enemyName").innerHTML = `${st.enemy} <span class="tag">Lv.${st.id}</span>`;
  $("enemySub").textContent = `${S.party.crowd} ｜ ${st.trait}`;
  buildProgress();
  renderStats(false);
  renderQuestion();
  show("battle");
}

function buildProgress(){
  const p = $("progress"); p.innerHTML = "";
  const total = STAGES[S.stageIndex].questions.length;
  for(let i=0;i<total;i++){
    const d = document.createElement("div");
    d.className = "dot" + (i < S.qIndex ? " on" : (i === S.qIndex ? " cur" : ""));
    p.appendChild(d);
  }
}

/* ======================= 顔・気分の反映 ======================= */
function faceFor(temp){
  if (temp >= 80) return "😄";      // 笑顔（よし、乗った！）
  if (temp >= 40) return "🤔";      // 悩む（腕を組んで考える）
  return "😒";                      // 冷酷（冷ややかな目）
}
function moodColor(temp){
  if (temp >= 80) return "radial-gradient(circle, rgba(57,255,136,.9), transparent 70%)";
  if (temp >= 40) return "radial-gradient(circle, rgba(255,181,46,.9), transparent 70%)";
  return "radial-gradient(circle, rgba(58,123,213,.85), transparent 70%)";
}
function bubbleClass(temp){
  if (temp >= 80) return "bubble warm";
  if (temp >= 40) return "bubble think";
  return "bubble";
}

function renderStats(animate){
  const t = Math.max(0, Math.min(100, Math.round(S.temp)));
  const hp = Math.max(0, Math.min(S.maxHp, Math.round(S.hp)));
  $("tempNum").textContent = t;
  $("tempFill").style.width = t + "%";
  $("hpNum").textContent = hp + "/" + S.maxHp;
  $("hpFill").style.width = (hp / S.maxHp * 100) + "%";
  // HP低下で赤く
  $("hpFill").style.background = hp <= 30
    ? "linear-gradient(90deg,#7a1e1e,var(--hp-low))"
    : "linear-gradient(90deg,#1e7a4a,var(--hp))";
  // 家族グラフィック・気分
  renderGroup(moodName(t));
  $("moodRing").style.background = moodColor(t);
}

/* ======================= 質問の描画 ======================= */
function renderQuestion(){
  const st = STAGES[S.stageIndex];
  const q = st.questions[S.qIndex];
  buildProgress();

  const bubble = $("bubble");
  bubble.className = bubbleClass(S.temp);
  bubble.textContent = q.text;

  // 選択肢をシャッフルして表示（順番はランダム）
  const order = shuffle([0,1,2,3]);
  const wrap = $("choices");
  wrap.innerHTML = "";
  const keys = ["A","B","C","D"];
  order.forEach((ci, idx) => {
    const c = q.choices[ci];
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="k">${keys[idx]}</span><span>${c.text}</span>`;
    btn.onclick = (e) => onChoose(c, btn, e);
    wrap.appendChild(btn);
  });
  S.locked = false;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ======================= 選択肢クリック処理 ======================= */
function onChoose(choice, btn, ev){
  if (S.locked) return;
  S.locked = true;

  // 全ボタン無効化＆正誤の色付け
  document.querySelectorAll("#choices .choice").forEach(b => b.classList.add("disabled"));
  btn.classList.add(choice.temp > 0 && choice.hp >= 0 ? "correct" : "wrong");

  // 数値反映
  S.temp += choice.temp;
  S.hp += choice.hp;
  if (S.temp > 100) S.temp = 100;
  if (S.temp < 0) S.temp = 0;

  // 演出
  spawnFloats(choice, ev);
  if (choice.hp < 0){ screenFlash("dmg"); shakeFrame(); }
  else if (choice.hp > 0){ screenFlash("heal"); }
  if (choice.temp > 0){ hitEnemy(); }

  // 顧客のセリフ変化
  const bubble = $("bubble");
  bubble.className = bubbleClass(S.temp);
  bubble.textContent = choice.reply;

  renderStats(true);

  // 判定
  setTimeout(() => {
    if (S.hp <= 0){ gameOver(); return; }
    if (S.temp >= 100){ stageClear(); return; }

    // 次の質問へ
    S.qIndex++;
    if (S.qIndex >= STAGES[S.stageIndex].questions.length){
      // 全問終了：温度感で最終判定
      if (S.temp >= 80) stageClear();
      else gameOver(true);
    } else {
      renderQuestion();
    }
  }, 1150);
}

/* ======================= 演出まわり ======================= */
function spawnFloats(choice, ev){
  const frame = $("frame");
  const rect = frame.getBoundingClientRect();
  const x = ev ? (ev.clientX - rect.left) : rect.width/2;
  const y = ev ? (ev.clientY - rect.top) : rect.height/2;

  if (choice.temp !== 0){
    const f = document.createElement("div");
    f.className = "float";
    f.style.color = choice.temp > 0 ? "var(--neon-yellow)" : "var(--temp-cold)";
    f.style.left = (rect.width/2 - 20) + "px";
    f.style.top = (rect.height*0.32) + "px";
    f.textContent = (choice.temp > 0 ? "🔥+" : "❄") + Math.abs(choice.temp) + "%";
    frame.appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }
  if (choice.hp !== 0){
    const f = document.createElement("div");
    f.className = "float";
    f.style.color = choice.hp > 0 ? "var(--neon-green)" : "var(--neon-red)";
    f.style.left = Math.max(10, Math.min(rect.width-80, x-20)) + "px";
    f.style.top = Math.max(10, y-30) + "px";
    f.textContent = (choice.hp > 0 ? "+" : "") + choice.hp + " HP";
    frame.appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }
}
function hitEnemy(){
  const e = $("enemyGroup");
  e.classList.remove("hit"); void e.offsetWidth; e.classList.add("hit");
}
function screenFlash(type){
  const f = $("flash");
  f.className = ""; void f.offsetWidth; f.classList.add(type);
  setTimeout(() => f.className = "", 400);
}
function shakeFrame(){
  const fr = $("frame");
  fr.classList.remove("shake"); void fr.offsetWidth; fr.classList.add("shake");
  setTimeout(() => fr.classList.remove("shake"), 400);
}

/* ======================= クリア ======================= */
function stageClear(){
  S.cleared[S.stageIndex] = true;
  const st = STAGES[S.stageIndex];
  $("clearQuote").textContent = st.quotes[Math.floor(Math.random()*st.quotes.length)];
  $("clearStats").innerHTML =
    `<div>残メンタルHP <b>${Math.max(0,Math.round(S.hp))}</b></div>` +
    `<div>温度感 <b>100%</b></div>` +
    `<div>STAGE ${st.id} CLEAR</div>`;
  // 次ステージボタン制御
  const hasNext = S.stageIndex < STAGES.length - 1;
  $("clearNext").style.display = hasNext ? "" : "none";
  show("clear");
  confettiBurst();
}
$("clearNext").onclick = () => {
  if (S.stageIndex < STAGES.length - 1) startStage(S.stageIndex + 1);
  else { buildStageSelect(); show("select"); }
};
$("clearSelect").onclick = () => { buildStageSelect(); show("select"); };

function confettiBurst(){
  const frame = $("frame");
  const colors = ["#ffe14d","#ff2d55","#39ff88","#26e0ff","#ff4d8d"];
  for(let i=0;i<40;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.5 + Math.random()*1.5) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    frame.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

/* ======================= ゲームオーバー（失注） ======================= */
function gameOver(byTemp){
  const pick = OVER_QUOTES[Math.floor(Math.random()*OVER_QUOTES.length)];
  $("overQuote").textContent = pick.q;
  $("overSub").textContent = pick.s + (byTemp ? "　（惜しい！あと少し温度感が足りなかった）" : "");
  show("over");
}
$("retry").onclick = () => startStage(S.stageIndex);   // 1タップ即リトライ
$("overSelect").onclick = () => { buildStageSelect(); show("select"); };
$("giveUp").onclick = () => { if(confirm("撤退してステージ選択に戻る？")){ buildStageSelect(); show("select"); } };

/* ======================= キーボード対応（PCデバッグ用） ======================= */
document.addEventListener("keydown", (e) => {
  if (!screens.battle.classList.contains("active") || S.locked) return;
  const map = { a:0,b:1,c:2,d:3, "1":0,"2":1,"3":2,"4":3 };
  const idx = map[e.key.toLowerCase()];
  if (idx !== undefined){
    const btns = document.querySelectorAll("#choices .choice");
    if (btns[idx]) btns[idx].click();
  }
});

/* 初期化 */
renderStats(false);
</script>
