<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>営業ロープレ｜通信回線 切り替え営業トレーニング</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2130;
    --panel-2: #222b3d;
    --line: #2f3a4f;
    --text: #e8edf5;
    --muted: #9aa7bd;
    --accent: #3b82f6;
    --accent-2: #22c55e;
    --danger: #ef4444;
    --cust: #2b3550;
    --sales: #1e3a2f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
      "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(160deg, #0f1420, #131a29);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(20,26,40,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .tag {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    padding: 3px 8px; border-radius: 999px;
  }
  .spacer { flex: 1; }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
    font-weight: 600; transition: filter .15s, transform .05s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: var(--panel-2); color: var(--text); padding: 8px 14px;
    border: 1px solid var(--line); font-size: 13px;
  }
  .btn-ghost:hover:not(:disabled) { filter: brightness(1.2); }
  .btn-primary { background: var(--accent); color: #fff; padding: 10px 18px; font-size: 14px; }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }

  main {
    flex: 1; display: grid; grid-template-columns: 300px 1fr;
    gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .side { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; }
  label { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 4px; }
  input, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 9px 10px; font-size: 13px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .hint a { color: var(--accent); }

  .profile-card { min-height: 60px; }
  .profile-card .empty { color: var(--muted); font-size: 13px; }
  .profile-card ul { margin: 0; padding-left: 18px; }
  .profile-card li { font-size: 13.5px; line-height: 1.7; }

  .chat-wrap { display: flex; flex-direction: column; min-height: 0; }
  .chat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
    gap: 12px; min-height: 340px;
  }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
  .msg.cust { background: var(--cust); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.sales { background: var(--sales); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--muted);
    font-size: 12.5px; text-align: center; max-width: 100%; }
  .msg.feedback { background: #2a2340; align-self: stretch; max-width: 100%;
    border: 1px solid #4a3f6b; }
  .msg.secret { background: #3a2a1a; align-self: stretch; max-width: 100%;
    border: 1px dashed #7a5a2a; }
  .msg.hint { background: #14324a; align-self: stretch; max-width: 100%;
    border: 1px dashed #3a7ab0; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 4px; }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2){ animation-delay:.2s } .dots span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  .composer {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; display: flex; gap: 10px; align-items: center;
  }
  .mic {
    width: 58px; height: 58px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 22px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; position: relative;
  }
  .mic.rec { background: var(--danger); animation: pulse 1.3s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)} 70%{box-shadow:0 0 0 14px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }
  .composer textarea {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; resize: none;
    height: 52px; line-height: 1.4;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .send { background: var(--accent-2); color: #fff; padding: 0 18px; height: 52px; font-size: 14px; }

  .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; text-align: center; }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .toggle-row input { width: auto; }
  .toggle-row label { margin: 0; font-size: 12.5px; color: var(--text); }
  .banner {
    background: #3a2118; border: 1px solid #7a4a2a; color: #ffd9c0; padding: 10px 12px;
    border-radius: 10px; font-size: 12.5px; line-height: 1.5; margin-bottom: 12px;
  }
  code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🎧 通信回線 切り替え営業ロープレ</h1>
  <span class="tag">音声対話トレーニング</span>
  <div class="spacer"></div>
  <button class="btn-ghost" id="revealBtn" disabled>🔍 裏設定を見る</button>
  <button class="btn-ghost" id="resetBtn">↺ リセット</button>
</header>

<main>
  <aside class="side">
    <div class="card" id="setupCard">
      <h2>設定</h2>
      <label>AI提供元</label>
      <select id="provider">
        <option value="gemini">Google Gemini（無料・カード不要）</option>
        <option value="anthropic">Claude（Anthropic・有料）</option>
      </select>
      <label id="keyLabel">Gemini APIキー</label>
      <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" />
      <label>お客様の頭脳（モデル）</label>
      <div style="display:flex;gap:6px">
        <select id="model" style="flex:1"></select>
        <button type="button" class="btn-ghost" id="refreshModels" title="このキーで使えるモデル一覧を取得" style="padding:8px 11px">🔄</button>
      </div>
      <label>お客様の声（音声合成）</label>
      <select id="voiceSel"></select>
      <div class="toggle-row">
        <input type="checkbox" id="autoMic" checked />
        <label for="autoMic">返答後に自動でマイクON</label>
      </div>
      <p class="hint" id="keyHint"></p>
    </div>

    <div class="card">
      <h2>お客様プロフィール</h2>
      <div class="profile-card" id="profile">
        <div class="empty">「ロープレ開始」を押すと、イベントブースで見えるお客様情報が表示されます。</div>
      </div>
      <button class="btn-primary" id="startBtn" style="width:100%;margin-top:12px">▶ ロープレ開始</button>
    </div>
  </aside>

  <section class="chat-wrap">
    <div class="banner" id="micBanner" style="display:none"></div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <button class="mic" id="micBtn" title="押して話す" disabled>🎤</button>
      <textarea id="text" placeholder="ここに営業トークを入力、またはマイクで話しかけてください…" disabled></textarea>
      <button class="send btn-primary" id="sendBtn" disabled>送信</button>
    </div>
    <div class="status" id="status"></div>
    <div class="toolbar">
      <button class="btn-ghost" id="hintBtn" disabled>💡 ヒント</button>
      <button class="btn-ghost" id="endBtn" disabled>🏁 終了して採点＆フィードバック（ギブアップ）</button>
      <button class="btn-ghost" id="replayBtn" disabled>🔁 同じ客でやり直す</button>
      <button class="btn-ghost" id="stopSpeakBtn">🔇 読み上げ停止</button>
    </div>
    <div class="status" id="turnInfo"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ---------- Roleplay system prompt ----------
  const SYSTEM_PROMPT = `# あなたの役割
あなたは通信回線（携帯・ネット・電気）の切り替え営業を受ける一般のお客様です。
ユーザーは新人営業マンで、あなたに営業を行います。
実際のお客様のようにリアルに感情や反応を表現し、実践的なロープレの相手をしてください。
これは音声で行う対話です。1回の返答は自然な会話として短め（多くても2〜4文程度）にし、実際に人が声に出して話すような口語で話してください。

# 裏設定（※ユーザーには絶対に自分から明かさない）
最初のターンで、以下をランダムに1つずつ決定し、\`<secret>\`〜\`</secret>\`タグの中に記録してください。このタグの中身はお客様の発言としては読み上げられず、ユーザーにも見えません。一度決めた設定は会話を通じて必ず一貫させてください。
- 名義人/決裁者の所在（A〜Cからランダム）
  - パターンA：目の前の本人が名義人/決裁者
  - パターンB：名義人は別だが、同じ館内（別フロアや別の店）にいる
  - パターンC：名義人は別で、今日はここに来ていない（仕事中・家で休み等）
- 現在の携帯キャリア（使用台数・機種種別・かけ放題の有無・月のデータ使用量・端末残債や更新月/縛りも決めておく）
- ネット回線（会社・契約期間・名義・料金・固定電話やテレビの有無・建物種別＝戸建/マンション/賃貸）
- 電力会社（プラン・契約期間・名義・オール電化か・太陽光の有無）
- 家族構成とそれぞれの利用状況（5〜18歳の学生がいるか等も決める）
- 現在の月額料金の合計（大まかな金額）
- 現在の利用理由（例：昔からなんとなく、家族割があるから 等）
- 乗り換え経験の有無・過去/現在の不満点・希望する特典（キャッシュバック希望額など）
- 本人確認書類の所持状況（免許/マイナ等。外国籍なら在留カードと在留期限も設定）
- 顧客の性格タイプ（例：温厚／慎重／理屈っぽい／多忙でせっかち 等）＝反応の一貫性に反映
- 隠れたニーズ（これが満たされたら成約。例：安くなるなら変えたいが手続きが面倒、実は通信速度に不満 等）
- 最初のアウト返し（例：今のままで困ってない、変えるのが面倒、時間がない 等）

※これらは全て「裏設定」。ユーザーの的確なヒアリングによってのみ少しずつ開示し、自分からは列挙しない。設問されていない項目を勝手に喋らない。

# 会話の絶対ルール
- AIであることを明かさず、完全にお客様になりきる。
- 質問には答えるが、自分から「隠れたニーズ」や「名義人の所在」をペラペラ語らない。ユーザーのヒアリング力で少しずつ引き出されるようにする。
- ユーザーのトークが強引だったり、メリットを感じない場合は明確に断り、すぐには納得しない。
- ユーザーが「マイドコモを見せて」「スマホ画面を見せて」など視覚確認を求めたら、設定に合わせて「はい、こんな感じです。月に動画を50GBくらい使ってるみたいです」等、具体的な利用状況を口頭で答えて会話を続ける。

# 名義人・決裁者に関する特殊ルール
- パターンB（館内にいる）：ヒアリングされるまで自ら言わない。興味付けに成功し「話を聞く価値がある」と深く納得した場合のみ、「じゃあ、あっちの店にいる夫（妻）を呼んできますね」と連れてくる展開に。
- パターンC（館内にいない）：その場での最終手続きは不可。クロージングの「刺さり具合」で以下に分岐。判定基準は厳密に：
  - 大成功（即成約）＝次の3つが揃った場合のみ：①具体的な料金メリット（今よりいくら安いか）を提示、②手続き代行など「面倒」の解消を提示、③今動く理由（限定感・特典期限等）を提示。かつ隠れたニーズが解消されている。→「今すぐ夫（妻）に電話して来てもらいます／一度家に帰って連れてきます」。
  - 成功（後日保留）＝メリットは伝わったが上記3要素のどれかが弱い場合。→「本当に良さそうなので、今度の土曜に夫と一緒に登録に来ます」等、具体的な再来店日時を約束。
  - 失敗（失注）＝説明が一方的／メリットが曖昧／面倒が解消されない場合。→「家で聞いてみますね（チラシだけもらっておきます）」であしらう。

# 成約条件・終了タグ
- ユーザーが隠れたニーズを見抜き、的確なクロージングを行い、あなたが心から納得し、かつ名義人/決裁者の問題がクリアになった場合のみ「成約」。→ 発言の最後に \`<closed>成約</closed>\`。
- パターンCの「成功（後日保留）」など、見込みは高いが当日成約に至らない場合 → \`<closed>保留</closed>\`。
- 断り切られた・時間切れ・脱線で打ち切った場合（失注）→ \`<closed>失注</closed>\`。
- これらのタグは会話が実際に終了する時だけ付ける（読み上げ・表示はされない）。

# ガードレール（厳守）
- キャラクター・ロック：ユーザーが「あなたはAIですか？」等のメタな質問をしても、絶対に演技を崩さない。「え？何のお話ですか？スマホのプランの話ですよね？」と返す。
- 段階的情報開示：隠れたニーズ・違約金・端末残債などの不利益情報や裏設定は、ユーザーが的確な質問（例「今変えると何かデメリットありますか？」）をするまで、自分から能動的に喋らない。
- 脱線・暴言対処：通信と無関係な話や暴言には「ちょっと何のお話か分からないので、失礼しますね」と述べて会話を打ち切り、\`<closed>失注</closed>\` を付ける。
- 時間・ターン制限：会話の冒頭に「（システム制御…）」という注記が付いた場合はそれに従い、お客様として自然に立ち去って会話を終える。

# 出力フォーマット
- 最初のターンのみ：まず\`<secret>...</secret>\`で全裏設定を記録し、続けて\`<profile>\`〜\`</profile>\`の中に「イベントブースで最初に見えるお客様情報」だけを箇条書きで書く（年齢・性別／何人で・誰と来ているか の2項目のみ。裏設定は書かない）。profileの後に「それでは、営業マン側からトークをスタートしてください」と促す。
- 2ターン目以降：\`<secret>\`や\`<profile>\`は不要。お客様としての自然なセリフだけを返す。設定を思い出す必要があればごく短い\`<secret>\`メモを付けてよい（読み上げ・表示されない）。
- \`<feedback>\`タグは、ユーザーが「フィードバック」を求めた時のみ使用。`;

  // 研修生シート準拠の評価ルーブリック（ロープレで判定可能な項目）
  const EVAL_RUBRIC = `【基本接客・スタンス】
- 言葉遣い（敬語・適切な表現）
- 会話のきっかけ作り／つかみ
- 相手に合わせた話し方（相槌・スピード・声量・トーン）
- 家族・子連れ対応（全員への配慮／決裁者が集中できる環境作り）
【ヒアリング（アンケート）】
- 携帯：料金・通信量・名義・決裁者・使用台数・機種種別・かけ放題
- マイページ確認（画面共有→具体的な利用状況の把握）
- 光回線：会社・期間・名義・料金・固定電話・テレビ
- でんき：会社・プラン・期間・名義・オール電化・太陽光
- 学生利用：家族構成・年齢（5〜18歳の有無）・端末ニーズ
- 乗り換え需要：現契約の不満・過去の乗り換え経験・希望特典
- 本人確認書類の所持確認（外国籍なら在留カード・在留期限）
- 聞き出した情報の整理・提案の組み立て
【ニーズ把握・興味付け】
- 料金ニーズ / 端末ニーズ / キャッシュバックニーズ（希望額）
- 限定感ニーズ / 学割・季節・話題性ニーズ
- 決裁者の見極め＆決裁者への興味付け
【クロージング】
- テストクロージング（温度感確認・ボトルネック洗い出し）
- ダブルクローザーを呼ぶ判断・タイミング（違和感なく）
- 名義人/決裁者の同席・手配（パターンA/B/Cに応じて）
- 見積の説明（初月・2ヶ月目以降、プラン変更・オプション見直し）
- MNP予約番号の知識（発行可否ブランド／電話・WEBの切り分け）
- 引継ぎ（名義・支払い・還元／データ移行・メアド・端末利用可否・SIMロック・APN）`;

  const FEEDBACK_TRIGGER = `【ロープレ終了・採点】あなたは営業指導者です。お客様役をやめ、指導者として、ここまでのロープレを採点してください。出力は必ず \`<feedback>\` 〜 \`</feedback>\` タグの中に、下記の並び順で書いてください。

★ロープレ結果：【成約】／【保留】／【失注】 のいずれか
★総合スコア：合計 X / 10点

■ スコア内訳（5項目×各2点。2点=十分できた／1点=試みたが不十分／0点=できていない）
1. アプローチ・ヒアリング（名義人・同行者・キャリア・データ量・料金を聞き出せたか）：n点 ｜ 一言
2. キラー論点の看破（端末残債・契約期間/違約金・光回線の工事要否など障害の確認）：n点 ｜ 一言
3. ニーズ合致（隠れたニーズを特定し、ピンポイントで解消するプラン提示）：n点 ｜ 一言
4. 料金比較の可視化（今よりいくら安く、どんなメリットかを分かりやすく提示）：n点 ｜ 一言
5. クロージング・主導権（面倒がる/名義人不在の顧客に妥当な解決策で成約に導く）：n点 ｜ 一言

【判定ルール】成約は「(A)名義人/決裁者のゲートをクリア」かつ「(B)隠れたニーズを解消」が絶対条件。

  // Treat capacity / rate errors as transient and worth retrying.
  function isTransient(e) {
    const s = e && e.status;
    if ([429, 500, 502, 503, 504, 529].includes(s)) return true;
    const m = ((e && e.message) || "").toLowerCase();
    return /high demand|overloaded|unavailable|resource_exhausted|try again|temporarily|rate limit|internal error/.test(m);
  }

  // Retry a request with exponential backoff on transient errors.
  async function withRetry(fn, tries) {
    tries = tries || 4;
    let lastErr;
    for (let i = 0; i < tries; i++) {
      try { return await fn(); }
      catch (e) {
        lastErr = e;
        if (!isTransient(e) || i === tries - 1) throw e;
        const wait = 1500 * Math.pow(2, i); // 1.5s, 3s, 6s …
        setStatus("⏳ 混雑のため再試行中… (" + (i + 1) + "/" + (tries - 1) + ") " + Math.round(wait / 1000) + "秒待機");
        await sleep(wait);
      }
    }
    throw lastErr;
  }

  async function callAnthropic(key, model, msgs) {
    return withRetry(async () => {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",

          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"

        body: JSON.stringify({
          model: model,
          max_tokens: 4096,
          system: SYSTEM_PROMPT,
          messages: msgs

        try { const j = await resp.json(); if (j.error && j.error.message) err = j.error.message; } catch (_) {}
        const e = new Error(err); e.status = resp.status; throw e;
      }
      const data = await resp.json();
      return (data.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    });
  }

  // Single request to one Gemini model.
  async function geminiRequest(key, model, contents) {
    const genCfg = { maxOutputTokens: 8192, temperature: 1.0 };
    // Disable "thinking" on 2.5 models so tokens go to the actual reply.
    if (/^gemini-2\.5/.test(model)) genCfg.thinkingConfig = { thinkingBudget: 0 };
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
      encodeURIComponent(model) + ":generateContent";
    const body = JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: contents,
      generationConfig: genCfg
    });
    const resp = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json", "x-goog-api-key": key },
      body: body
    });
    if (!resp.ok) {
      let err = resp.status + " " + resp.statusText;
      try { const j = await resp.json(); if (j.error && j.error.message) err = j.error.message; } catch (_) {}
      const e = new Error(err); e.status = resp.status; throw e;
    }
    const data = await resp.json();
    const cand = (data.candidates || [])[0];
    if (!cand || !cand.content || !cand.content.parts) {
      const reason = cand && cand.finishReason ? "（理由: " + cand.finishReason + "）" : "";
      throw new Error("応答が空でした" + reason + "。もう一度お試しください。");
    }
    return cand.content.parts.map(p => p.text || "").join("");
  }

  async function callGemini(key, model, msgs) {
    const contents = msgs.map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }]
    }));
    // If the chosen model is overloaded, fall back to lighter / less-busy ones.
    const FALLBACKS = ["gemini-flash-lite-latest", "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-pro-latest"];
    const seen = {};
    const candidates = [model].concat(FALLBACKS).filter(m => (seen[m] ? false : (seen[m] = 1, true)));
    let lastErr;
    for (let ci = 0; ci < candidates.length; ci++) {
      const cur = candidates[ci];
      try {
        const text = await withRetry(() => geminiRequest(key, cur, contents), 2);
        if (ci > 0) setStatus("⚠️ 選択モデルが混雑のため『" + cur + "』で応答しました。");
        return text;
      } catch (e) {
        lastErr = e;
        if (!isTransient(e)) throw e; // e.g. invalid key -> stop immediately
        if (ci < candidates.length - 1) setStatus("『" + cur + "』が混雑中… 別モデルを試しています…");
      }
    }
    throw lastErr;
  }

      addBubble("system", "", "❌ ヒント取得エラー: " + e.message);
    } finally {
      setBusy(false);
    }
  }

  function replaySameCustomer() {
    if (messages.length < 2) return;
    speechSynthesis.cancel();
    messages = messages.slice(0, 2);   // keep START trigger + persona/profile turn
    salesTurns = 0; startTime = Date.now(); ended = false; running = true;
    chat.innerHTML = "";
    addBubble("system", "", "🔁 同じお客様でやり直します。設定は同じ、会話だけリセットしました。");
    addBubble("system", "", "営業マン側からトークをスタートしてください。");
    setStatus(""); updateTurnInfo(); updateControls();
  }

  $("startBtn").addEventListener("click", startRoleplay);
  $("sendBtn").addEventListener("click", () => sendMessage());
  $("hintBtn").addEventListener("click", requestHint);
  $("replayBtn").addEventListener("click", replaySameCustomer);
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $("endBtn").addEventListener("click", () => {
    if (!running || busy) return;
    speechSynthesis.cancel();
    ended = true;
    turn(FEEDBACK_TRIGGER, true);
  });
  $("revealBtn").addEventListener("click", () => {
    if (!secrets.length) return;
    addBubble("secret", "🔍 裏設定（答え合わせ）", secrets.join("\n\n"));
  });
  $("resetBtn").addEventListener("click", () => {
    running = false; ended = false; messages = []; secrets = [];
    salesTurns = 0; startTime = 0;
    speechSynthesis.cancel();
    chat.innerHTML = ""; $("profile").innerHTML = '<div class="empty">「ロープレ開始」を押すと、イベントブースで見えるお客様情報が表示されます。</div>';
    setBusy(false);
    $("startBtn").textContent = "▶ ロープレ開始";
    setStatus(""); $("turnInfo").textContent = "";
  });

  // ---------- Init ----------
  if (!recognition) {} // banner already shown
})();
</script>
</body>
</html>
